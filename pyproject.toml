[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specific-ai-tools"
version = "0.1.1"
description = "Open toolkit for SpecificAI integrations and edge inference utilities"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "specific.ai team", email = "support@specific.ai" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "transformers",
    "huggingface_hub",
    "safetensors",
    "requests",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python"]
split = ["torch"]
dev = ["pytest", "torch"]

[project.urls]
Homepage = "https://specific.ai/"
Repository = "https://github.com/marketplace-specificai/specific-ai-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
